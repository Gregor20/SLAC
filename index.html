  <a href="#galeria" class="salto">Saltar a las fotos</a>

  <!-- ═══ CABECERA: aparece al dejar atrás la portada ═══ -->
  <header class="cabecera" id="cabecera">
    <a href="#inicio" class="cabecera-logo" aria-label="SLAC, volver arriba">
      <img src="public/img/logo-280.webp" srcset="public/img/logo-280.webp 280w, public/img/logo-560.webp 560w"
           sizes="96px" width="280" height="128" alt="">
    </a>
    <a class="cabecera-tel" data-contact="tel">
      <svg class="icono" aria-hidden="true"><use href="#i-tel"></use></svg>
      <span data-contact="tel-texto"></span>
    </a>
  </header>

  <main id="main">

    <!-- ═══ PORTADA: 1 foto en móvil, tríptico en escritorio (public/img/portada, ver PORTADA) ═══ -->
    <section class="portada" id="inicio" aria-label="Portada">
      <div class="portada-fotos">
        <picture><source type="image/avif" srcset="public/img/portada/1-480.avif 480w, public/img/portada/1-800.avif 800w, public/img/portada/1-1200.avif 1200w" sizes="(min-width: 900px) 38vw, 100vw">
          <img class="portada-foto portada-foto--principal"
             src="public/img/portada/1-800.webp"
             srcset="public/img/portada/1-480.webp 480w, public/img/portada/1-800.webp 800w, public/img/portada/1-1200.webp 1200w"
             sizes="(min-width: 900px) 38vw, 100vw" width="1200" height="1600" alt="" fetchpriority="high"></picture>
        <picture><source type="image/avif" srcset="public/img/portada/2-480.avif 480w, public/img/portada/2-800.avif 800w, public/img/portada/2-1200.avif 1200w" sizes="31vw">
          <img class="portada-foto portada-foto--izq"
             src="public/img/portada/2-800.webp"
             srcset="public/img/portada/2-480.webp 480w, public/img/portada/2-800.webp 800w, public/img/portada/2-1200.webp 1200w"
             sizes="31vw" width="1200" height="1600" alt="" loading="lazy" decoding="async"></picture>
        <picture><source type="image/avif" srcset="public/img/portada/3-480.avif 480w, public/img/portada/3-800.avif 800w, public/img/portada/3-1200.avif 1200w" sizes="31vw">
          <img class="portada-foto portada-foto--der"
             src="public/img/portada/3-800.webp"
             srcset="public/img/portada/3-480.webp 480w, public/img/portada/3-800.webp 800w, public/img/portada/3-1200.webp 1200w"
             sizes="31vw" width="1200" height="1600" alt="" loading="lazy" decoding="async"></picture>
      </div>

      <div class="portada-marca">
        <h1 class="portada-logo">
          <img src="public/img/logo-560.webp" srcset="public/img/logo-280.webp 280w, public/img/logo-560.webp 560w"
               sizes="(min-width: 600px) 380px, 64vw" width="560" height="255" alt="SLAC">
        </h1>
        <a class="portada-tel" data-contact="tel"><span data-contact="tel-texto"></span></a>
      </div>

      <a href="#galeria" class="portada-bajar" aria-label="Ver las fotos"><span aria-hidden="true"></span></a>
    </section>

    <!-- ═══ GALERÍA: la rellena app.js desde data/galeria.js ═══ -->
    <section class="galeria" id="galeria" aria-labelledby="galeria-titulo">
      <h2 id="galeria-titulo" class="solo-lector">Fotos de las prendas</h2>
      <ul class="galeria-rejilla" id="galeria-rejilla"></ul>
      <noscript><p class="aviso-sin-js">Activa JavaScript para ver las fotos y el teléfono.</p></noscript>
    </section>

    <!-- ═══ CONTACTO ═══ -->
    <section class="contacto" id="contacto" aria-labelledby="contacto-titulo">
      <picture><source type="image/avif" srcset="public/img/portada/4-480.avif 480w, public/img/portada/4-800.avif 800w, public/img/portada/4-1200.avif 1200w" sizes="100vw">
        <img class="contacto-fondo"
           src="public/img/portada/4-800.webp"
           srcset="public/img/portada/4-480.webp 480w, public/img/portada/4-800.webp 800w, public/img/portada/4-1200.webp 1200w"
           sizes="100vw" width="1200" height="1600" alt="" loading="lazy" decoding="async"></picture>
      <div class="contacto-contenido">
        <h2 id="contacto-titulo" class="solo-lector">Contacto</h2>
        <img class="contacto-logo" src="public/img/logo-280.webp" srcset="public/img/logo-280.webp 280w, public/img/logo-560.webp 560w"
             sizes="220px" width="280" height="128" alt="" loading="lazy" decoding="async">
        <a class="contacto-numero" data-contact="tel"><span data-contact="tel-texto"></span></a>
        <div class="contacto-acciones">
          <a class="boton boton--borde" data-contact="tel">
            <svg class="icono" aria-hidden="true"><use href="#i-tel"></use></svg>Llamar
          </a>
          <a class="boton boton--oro" data-contact="wa" target="_blank" rel="noopener noreferrer">
            <svg class="icono" aria-hidden="true"><use href="#i-wa"></use></svg>WhatsApp
          </a>
        </div>
      </div>
    </section>

  </main>

  <footer class="pie">
    <a href="aviso-legal.html">Aviso legal</a>
  </footer>

  <a class="flotante" id="flotante" data-contact="wa" target="_blank" rel="noopener noreferrer" aria-label="Escribir por WhatsApp">
    <svg class="icono" aria-hidden="true"><use href="#i-wa"></use></svg>
  </a>

  <!-- ═══ VISOR (<dialog>: foco atrapado, Escape y devolución del foco nativos) ═══ -->
  <dialog class="visor" id="visor" aria-label="Fotos">
    <div class="visor-barra">
      <span class="visor-id" id="visor-id"></span>
      <span class="visor-contador" id="visor-contador" aria-live="polite"></span>
      <button type="button" class="visor-boton visor-cerrar" id="visor-cerrar" aria-label="Cerrar">
        <svg class="icono" aria-hidden="true"><use href="#i-cerrar"></use></svg>
      </button>
    </div>
    <div class="visor-escena" id="visor-escena">
      <picture><source id="visor-fuente" type="image/avif"><img class="visor-foto" id="visor-foto" alt=""></picture>
      <button type="button" class="visor-boton visor-flecha visor-flecha--ant" id="visor-ant" aria-label="Foto anterior">
        <svg class="icono" aria-hidden="true"><use href="#i-ant"></use></svg>
      </button>
      <button type="button" class="visor-boton visor-flecha visor-flecha--sig" id="visor-sig" aria-label="Foto siguiente">
        <svg class="icono" aria-hidden="true"><use href="#i-sig"></use></svg>
      </button>
    </div>
    <div class="visor-miniaturas" id="visor-miniaturas" role="group" aria-label="Miniaturas"></div>
  </dialog>

</body>
</html>
